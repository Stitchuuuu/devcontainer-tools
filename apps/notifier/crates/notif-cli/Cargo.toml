[package]
name = "notif-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "notif"
path = "src/main.rs"

[dependencies]
# `notif-macos` is a normal (unconditional) dep starting session 7a:
# `MacosOverrides` + `InterruptionLevel` types are referenced by the CLI's
# `--macos-*` value parsers, which need to compile on every platform for
# CLI-shape tests. The platform-gated objc2 tree stays inside notif-macos
# behind `#[cfg(target_os = "macos")]` so Linux builds only pull the
# type-only `overrides` module.
clap = { version = "4.6", features = ["derive"] }
notif-core = { path = "../notif-core" }
notif-macos = { path = "../notif-macos" }
anyhow = "1"
# ISO-8601 timestamp seed for `CallbackPayload.ts`. Already in the
# transitive tree via notif-core, so this is a re-exposure, not a new
# dep.
time = { version = "0.3.53", features = ["formatting"] }

# notif-windows is only linked when building for Windows targets. The crate's
# public surface (WindowsBackend / dispatch_send / init_logging) is entirely
# `#[cfg(target_os = "windows")]`, so pulling it in on macOS/Linux would just
# add empty symbols to the build tree.
[target.'cfg(windows)'.dependencies]
notif-windows = { path = "../notif-windows" }
