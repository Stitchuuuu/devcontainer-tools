[package]
name = "notif-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "notif"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
notif-core = { path = "../notif-core" }
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
notif-macos = { path = "../notif-macos" }
