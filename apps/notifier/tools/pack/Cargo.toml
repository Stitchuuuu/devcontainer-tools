[package]
name = "notif-pack"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dev tool: bundle notif.exe release build into a zip for host handoff."

[[bin]]
name = "notif-pack"
path = "src/main.rs"

[dependencies]
anyhow = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
