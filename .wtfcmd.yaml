# Root wtf config — global aliases for common project workflows.
# Each command runs from the repo root ; per-project cwd is set via `cd`
# in the cmd body so callers can invoke `wtf <cmd>` from anywhere.

# ---- notif — cross-compile + logs -----------------------------------------
# The container can't RUN Mach-O binaries, only produce them. Once built,
# the binary lands at packages/notifier/target/aarch64-apple-darwin/release/notif
# and is visible from the Mac host via the workspace bind-mount.
#
# `cwd: ./packages/notifier` — leading `.` resolves relative to this config
# file's directory (per wtfcmd), so commands run inside the crate root
# regardless of where the caller invoked `wtf` from.

- group: notif
  name: build
  cwd: ./packages/notifier
  desc: Cross-compile the release Mach-O for Apple Silicon.
  cmd: cargo zigbuild --release --target aarch64-apple-darwin --bin notif

- group: notif
  name: build-debug
  cwd: ./packages/notifier
  desc: Cross-compile the debug Mach-O (faster rebuild, unoptimized).
  cmd: cargo zigbuild --target aarch64-apple-darwin --bin notif

- group: notif
  name: test
  cwd: ./packages/notifier
  desc: Run every test + clippy on the workspace.
  cmd: |
    cargo clippy --workspace --all-targets -- -D warnings
    cargo test -p notif-cli -p notif-core -p notif-macos

- group: notif
  name: bin-path
  cwd: ./packages/notifier
  desc: Print the absolute container path of the release Mach-O.
  cmd: echo "$(pwd)/target/aarch64-apple-darwin/release/notif"

- group: notif
  name: log
  desc: Tail the shared audit log (NOTIF_LOG env or ~/.local/share/notif/notif.log).
  cmd: tail -f "${NOTIF_LOG:-$HOME/.local/share/notif/notif.log}"

- group: notif
  name: dev
  cwd: ./packages/notifier
  desc: |
    Build (debug) + run the Mach-O with arbitrary passthrough args.
    Example : wtf notif dev -- send --title Hello --body World
  cmd: |
    cargo zigbuild --target aarch64-apple-darwin --bin notif >/dev/null
    ./target/aarch64-apple-darwin/debug/notif {{ range .args }}{{ esc . }} {{ end }}
  args:
    - name: args
      desc: Arguments forwarded verbatim to the notif binary.
      is_array: true

# ---- image — base image suites ---------------------------------------------
# A full pass is TWO runs: one in the devcontainer (manifest, firewall, overlay
# layer 1), one on the host with Docker running (overlay layer 2, image
# suites). The runner detects which side it is on and names what is left.

- group: image
  name: test
  desc: |
    Every base-image suite, according to the detected context.
    Replay on both sides (container then host) at each minor/major bump.
  cmd: bash ./packages/devcontainer-sandbox/test/run-all.sh

- group: image
  name: release-check
  desc: |
    Full release gate before a minor/major version bump : --no-cache build,
    content + suite checks, scratch scaffold, VS Code Reopen (fresh boot +
    reattach-to-running for defect 6's one reachable path), collection,
    verdict.
    Same command on both sides, the script detects which one (/.dockerenv):
    on the host (macOS, Docker Desktop, VS Code) it plays all 11 steps and
    is the only side that can exit 0 ; inside the devcontainer it plays
    headless, against the nested dind daemon ONLY (hardcoded assertion,
    fatal otherwise), everything that does not need VS Code — and marks ∅
    steps 5/6/9 that only the human can play. Its success path is
    therefore GREEN PARTIEL / exit 2, never 0. It leaves an image tarball
    the host inherits steps 1 and 2-3 from instead of repaying them.
    Three verdicts : GREEN (everything played and verified, exit 0 — the
    image is publishable) / GREEN PARTIEL (nothing failed but at least one
    step deliberately not played or reserved for the other half, exit 2) /
    RED (a failure, or a step skipped because something upstream broke,
    exit 1).
  flags:
    - name: no-purge
      desc: |
        Do not purge the VS Code server cache (`vscode` volume, shared by
        ALL devcontainers on the machine). Step 6 is then not a cold boot
        and R2 traverses nothing : steps 5 and 9 marked ⊘, verdict GREEN
        PARTIEL, exit 2.
      default: ""
      test: "$bool"
  cmd: bash ./packages/devcontainer-sandbox/test/release-check.sh{{ if .no_purge }} --no-purge{{ end }}

- group: image
  name: bare
  desc: |
    A throwaway project on the image and CLI of THIS tree, scaffolded by
    `devc init --yes` and opened in VS Code — the light companion of
    release-check: no gate, no verdict, no --no-cache build. Image =
    devcontainer-sandbox:local (what release-check leaves; refused when
    absent), CLI = this checkout packed and installed offline, so the
    initializeCommand provably runs the tree and nothing published.
    Scratch .tmp/bare/, DC_PROJECT bare-project, swept at every run; the
    shared creds volume is never a candidate. HOST ONLY — refused inside a
    devcontainer, where docker is the nested dind VS Code cannot reach.
    Every run is written to .tmp/bare.log. Once inside the project:
    bash /workspace/check-in-container.sh.
  flags:
    - name: pat
      desc: |
        Wire the extension patchers. Token from ~/.config/devc/ext-patches.env
        (projected by devc initialize at boot), else EXT_PATCHES_TOKEN in the
        environment; neither = refusal with the recipe.
      default: ""
      test: "$bool"
    - name: shared-creds
      desc: |
        Mount this repo's CLAUDE_CREDS_VOLUME (a signed-in Claude session)
        instead of a throwaway claude-creds-bare-project wiped at every run.
      default: ""
      test: "$bool"
    - name: published
      desc: |
        The registries instead of the tree: the GHCR tag the CLI template
        pins and the npm version the CLI package.json names. Both must resolve.
      default: ""
      test: "$bool"
    - name: build
      desc: |
        Build devcontainer-sandbox:local from this tree first, cached layers
        (the gate's build is --no-cache). For a machine where release-check
        has not run, or ran before the last commit.
      default: ""
      test: "$bool"
  cmd: bash ./packages/devcontainer-sandbox/test/bare-project.sh{{ if .pat }} --pat{{ end }}{{ if .shared_creds }} --shared-creds{{ end }}{{ if .published }} --published{{ end }}{{ if .build }} --build{{ end }}

# ---- base — run THIS devcontainer on the base image of this tree -----------
# HOST ONLY. `dev` builds packages/devcontainer-sandbox as
# devcontainer-sandbox:dev and selects it in .devcontainer/.env; `published`
# goes back to the GHCR tag the Dockerfile pins. Either way, then: VS Code →
# Rebuild Container (not "Without Cache" — it would try to pull :dev).

- group: base
  name: status
  desc: |
    Which base .devcontainer/.env selects (dev or published), and whether
    devcontainer-sandbox:dev is current with the tree (uncommitted changes
    count). Reads only.
  cmd: bash ./.devcontainer/host-helpers/base-switch status

- group: base
  name: build
  desc: |
    Build devcontainer-sandbox:dev from packages/devcontainer-sandbox
    (cached). Selects nothing — on dev already, follow with Rebuild Container.
  cmd: bash ./.devcontainer/host-helpers/base-switch build

- group: base
  name: dev
  desc: |
    Build devcontainer-sandbox:dev, then select it in .devcontainer/.env.
    Refuses (and names the line) when a BASE_IMAGE line of your own is
    active. Then: Rebuild Container.
  cmd: bash ./.devcontainer/host-helpers/base-switch dev

- group: base
  name: published
  desc: |
    Remove the selection `wtf base dev` wrote: back to the published GHCR
    base the Dockerfile pins. Then: Rebuild Container.
  cmd: bash ./.devcontainer/host-helpers/base-switch published

# ---- ext-patch — the VS Code extension patchers of THIS container ---------
# Convenience only. The command itself is `ext-patches-update`, baked into the
# image and on PATH in any container built from it; this group just spares the
# name. Which patchers a container runs is set by EXT_PATCHES_* in
# .devcontainer/.env — the image ships none and names no repository.

- group: ext-patch
  name: status
  desc: |
    What is configured, what is cached, and whether the patch sentinels are
    live in the extension on disk. Reads only — never writes, never fetches.
  cmd: ext-patches-sync --status

- group: ext-patch
  name: update
  desc: |
    Move this container to another patch set. With no flag: resolves the
    latest release of EXT_PATCHES_REPO (falling back to its tag list, which
    is what a repository with tags and no releases uses), applies it, and
    rewrites EXT_PATCHES_REF in .devcontainer/.env — the pin only moves once
    the patchers are actually on disk. A VS Code window reload is needed for
    the change to reach the extension host.
  flags:
    - name: check
      desc: Say what is installed and what is available, then stop.
      default: ""
      test: "$bool"
    - name: ref
      desc: Install this tag or commit SHA instead of resolving the latest.
      default: ""
    - name: auto
      desc: Drop a pin set by --ref and go back to this line's newest cached tag.
      default: ""
      test: "$bool"
    - name: dir
      desc: Apply from a local checkout of patchers — no network, no token.
      default: ""
    - name: reapply
      desc: Replay the current ref from the cache, e.g. after a Claude Code bump.
      default: ""
      test: "$bool"
    - name: no-write-env
      desc: Apply without moving the pin — a trial run.
      default: ""
      test: "$bool"
  cmd: >-
    ext-patches-update{{ if .check }} --check{{ end }}{{ if .ref }} --ref
    {{ .ref }}{{ end }}{{ if .auto }} --auto{{ end }}{{ if .dir }} --dir
    {{ .dir }}{{ end }}{{ if .reapply }} --reapply{{ end }}{{ if .no_write_env }}
    --no-write-env{{ end }}

- group: ext-patch
  name: local
  cwd: ./
  desc: |
    Apply the patchers of packages/claude-ext-patchs as they are in the tree,
    committed or not — `wtf ext-patch update --dir` with the path filled in.
    Starts again from the pristine extension and replaces the synced set, so
    a later restore-ext-patches keeps them; a patcher present only in the
    synced set is dropped. The pin in .devcontainer/.env is not touched.
    Then: Developer: Reload Window.
  flags:
    - name: check
      desc: Count the patchers and sentinels of the checkout, then stop.
      default: ""
      test: "$bool"
  cmd: ext-patches-update --dir "$(pwd)/packages/claude-ext-patchs/patchers"{{ if .check }} --check{{ end }}

# ---- shareglaude — receive a shared Claude Code token (user B side) --------
# Runs INSIDE the devcontainer: it writes ~/.claude/.credentials.json and needs
# platform.claude.com + api.anthropic.com, both allowlisted here. Deploying the
# Worker is the opposite, host-only — see apps/shareglaude/README.md.
#
# `cwd: ./.devcontainer` so shareglaude.env and scripts/ resolve wherever the
# caller invoked wtf from. Kept here rather than in .devcontainer/.wtfcmd.yaml
# precisely so that `wtf token share` works from the workspace root.

- group: token
  name: share
  cwd: ./.devcontainer
  desc: |
    Receive a Claude Code token shared by another account, via shareglaude.
      wtf token share       → dev deployment  (SHAREGLAUDE_URL_DEV)
      wtf token share prod  → prod deployment (SHAREGLAUDE_URL_PROD)
    Prints a login URL to hand to the account holder, checks the token that
    comes back, and stages it — the live credentials are never touched here.
    Answer y at the prompt to install now, or run `wtf token promote` later.
    Reads .devcontainer/shareglaude.env.
  args:
    - name: env
      desc: Target deployment — omit for dev (workers.dev), "prod" for the custom domain.
      default: dev
      test: ^(dev|prod)$
  cmd: |
    if [ ! -f shareglaude.env ]; then
      echo "wtf token share: .devcontainer/shareglaude.env is missing." >&2
      echo "  cp .devcontainer/shareglaude.env.example .devcontainer/shareglaude.env" >&2
      exit 1
    fi
    sg_get() {
      sed -n "s/^[[:space:]]*$1=//p" shareglaude.env | tail -1 | sed -e 's/^"//' -e 's/"$//'
    }
    {{ if eq .env "prod" }}var=SHAREGLAUDE_URL_PROD{{ else }}var=SHAREGLAUDE_URL_DEV{{ end }}
    url=$(sg_get "$var")
    if [ -z "$url" ]; then
      echo "wtf token share {{ .env }}: $var is empty in .devcontainer/shareglaude.env." >&2
      exit 1
    fi
    echo "-> shareglaude {{ .env }}: $url"
    SHAREGLAUDE_KEY=$(sg_get SHAREGLAUDE_KEY) \
    SHAREGLAUDE_PROMOTE_HINT="wtf token promote" \
    exec ./scripts/claude-token-share.mjs --url "$url" --test

- group: token
  name: promote
  cwd: ./.devcontainer
  desc: |
    Install the token staged by `wtf token share`, then delete the staged file.
    No session, no login URL. Re-validates the staged token first and refuses
    one that expired or was revoked since staging.
    The current credentials are kept as .credentials.json.bak-<timestamp>.
  cmd: exec ./scripts/claude-token-share.mjs --promote

# ---- docker — disk usage and reclaim ---------------------------------------
# HOST ONLY. Inside the devcontainer, `docker` talks to the NESTED daemon
# (dind-storage-*), which has homonymous images with different IDs — you would
# measure and clean the wrong machine. Both commands refuse nothing, so check
# where you are before reading the numbers.

- group: docker
  name: usage
  desc: |
    What Docker occupies, and what of it is reclaimable. Removes nothing.
    Beyond `docker system df`, which under-reports: the build cache broken
    down BY BUILD STEP, with the image(s) each step belongs to — recovered by
    joining the step text against every image's `docker history`, since
    BuildKit does not record it. A step shown with "+N more" is shared, and
    deleting it would take a neighbour's cache with it.
  flags:
    - name: cache
      desc: Add the per-step cache table. Slower, it reads every image history.
      default: ""
      test: "$bool"
  cmd: bash ./.devcontainer/host-helpers/docker-reclaim.sh{{ if .cache }} --cache{{ end }}

- group: docker
  name: reclaim
  desc: |
    Remove Docker junk. With no flag it reports and removes NOTHING, so run it
    bare first and read what it would take.
    Named volumes are never candidates, whatever you ask — the difference
    between a cache and a database is a name you have to read. That covers
    claude-code-config-* (Claude sessions and transcripts), claude-creds-*,
    vscode, dind-storage-* and every project database. Stopped containers are
    not candidates either: a stopped project is still a project.
    Prefer --cache-dead over --cache-dupes. The cache is a DAG (98% of records
    have a parent) and the newest copy of a step descends from the older ones,
    so cache-dupes targets the parents of what it keeps and BuildKit refuses:
    measured 328 records asked, 51 freed, 2.34 GB. cache-dead takes whole
    unreferenced chains and actually reclaims the space.
  flags:
    - name: builders
      desc: |
        Inactive container-driver buildx builders AND their state volumes,
        including volumes orphaned by an earlier `buildx rm` (which leaves
        them behind — 13.44 GB was found stranded that way).
      default: ""
      test: "$bool"
    - name: dangling
      desc: Untagged images no container uses. Tagged images are never touched.
      default: ""
      test: "$bool"
    - name: anon-volumes
      desc: Anonymous volumes (64 hex chars) with zero links. Named ones, never.
      default: ""
      test: "$bool"
    - name: cache-dead
      desc: |
        Every cache chain backing no existing image — the "reclaimable" figure
        docker system df prints. No size limit. The next build re-runs those
        steps.
      default: ""
      test: "$bool"
    - name: cache-dupes
      desc: |
        Older copies of an identical step, keeping the most recent. Safe but
        largely ineffective against the DAG — see the description above.
      default: ""
      test: "$bool"
  cmd: |
    bash ./.devcontainer/host-helpers/docker-reclaim.sh{{ if or .builders .dangling .anon_volumes .cache_dead .cache_dupes }} --apply{{ end }}{{ if .builders }} builders{{ end }}{{ if .dangling }} dangling{{ end }}{{ if .anon_volumes }} anon-volumes{{ end }}{{ if .cache_dead }} cache-dead{{ end }}{{ if .cache_dupes }} cache-dupes{{ end }}

- name: cleanup
  desc: |
    Reclaim disk, touching only what is safe to lose. Same command in the
    devcontainer and on the Mac. With no flag it REPORTS and removes
    nothing: run it bare first, read, then --apply.
    In the devcontainer: devc-sweep for this container — abandoned test temp
    dirs, scratch dirs of ended Claude sessions, transcripts older than 30
    days ARCHIVED, not deleted (devc-sweep restore <id> brings one back).
    On the Mac, it also sees Docker Desktop:
      1. the same devc-sweep inside this project's devcontainer ("not
         connected" when it is not running);
      2. Docker: build cache backing no image, untagged images no container
         uses, idle buildx builders, anonymous volumes with zero links
         (= wtf docker reclaim --cache-dead --dangling --builders --anon-volumes);
      3. with --all, devc-sweep in every other running devcontainer.
    It NEVER touches named volumes (databases, Claude configs), stopped
    containers, tagged images or live Claude sessions. Stopped containers
    that pin images are listed in the report for you to decide.
  flags:
    - name: apply
      desc: Actually remove (and archive). Without it, nothing changes.
      default: ""
      test: "$bool"
    - name: all
      desc: On the Mac, also every OTHER running devcontainer. No effect inside one.
      default: ""
      test: "$bool"
  # wtf runs cmd in the caller's cwd, which can be any subdirectory: find the
  # helper by walking up instead of trusting a relative path.
  cmd: |
    d="$PWD"; while [ "$d" != / ] && [ ! -f "$d/.devcontainer/host-helpers/cleanup.sh" ]; do d=$(dirname "$d"); done
    [ -f "$d/.devcontainer/host-helpers/cleanup.sh" ] || { echo "wtf cleanup: .devcontainer/host-helpers/cleanup.sh not found above $PWD" >&2; exit 1; }
    bash "$d/.devcontainer/host-helpers/cleanup.sh"{{ if .apply }} --apply{{ end }}{{ if .all }} --all{{ end }}

# ---- session — archived Claude conversations (devc-sweep archives them) -----
# DEVCONTAINER ONLY. Scope: the project of the directory you run it from.
# One archive = one session; restored ones are back in /resume.
- group: session
  name: archived
  desc: |
    List this project's archived conversations — date, size, title — newest
    first. devc-sweep (wtf cleanup) archives conversations untouched for 30
    days; they leave /resume until restored. Removes nothing.
  flags:
    - name: match
      desc: Only titles containing this text (any case).
      default: ""
  cmd: |
    d="$PWD"; while [ "$d" != / ] && [ ! -f "$d/.devcontainer/host-helpers/session.sh" ]; do d=$(dirname "$d"); done
    [ -f "$d/.devcontainer/host-helpers/session.sh" ] || { echo "wtf session: .devcontainer/host-helpers/session.sh not found above $PWD" >&2; exit 1; }
    bash "$d/.devcontainer/host-helpers/session.sh" archived{{ if .match }} --match {{ esc .match }}{{ end }}

- group: session
  name: show
  desc: Read one archived conversation (what you and Claude said, tools folded) without restoring it.
  args:
    - name: id
      desc: The session id, or its first characters (as listed by wtf session archived).
  cmd: |
    d="$PWD"; while [ "$d" != / ] && [ ! -f "$d/.devcontainer/host-helpers/session.sh" ]; do d=$(dirname "$d"); done
    [ -f "$d/.devcontainer/host-helpers/session.sh" ] || { echo "wtf session: .devcontainer/host-helpers/session.sh not found above $PWD" >&2; exit 1; }
    bash "$d/.devcontainer/host-helpers/session.sh" show {{ esc .id }}

- group: session
  name: restore
  desc: |
    Put archived conversations back in /resume. With no argument: a picker —
    type to search titles, preview on the right, Tab to pick several, Ctrl-A
    for all, Enter to restore. Never overwrites: an id already in /resume is
    skipped and said so.
  flags:
    - name: all
      desc: Every archived conversation of this project (lists them, then asks).
      default: ""
      test: "$bool"
    - name: match
      desc: With --all, only titles containing this text.
      default: ""
    - name: "yes"
      desc: With --all, do not ask.
      default: ""
      test: "$bool"
  args:
    - name: ids
      desc: Session ids (or their first characters) to restore directly.
      is_array: true
  cmd: |
    d="$PWD"; while [ "$d" != / ] && [ ! -f "$d/.devcontainer/host-helpers/session.sh" ]; do d=$(dirname "$d"); done
    [ -f "$d/.devcontainer/host-helpers/session.sh" ] || { echo "wtf session: .devcontainer/host-helpers/session.sh not found above $PWD" >&2; exit 1; }
    bash "$d/.devcontainer/host-helpers/session.sh" restore{{ if .all }} --all{{ end }}{{ if .match }} --match {{ esc .match }}{{ end }}{{ if .yes }} --yes{{ end }}{{ range .ids }} {{ esc . }}{{ end }}

# ---- cours — the Canva bridge of apps/cours-kevledev -----------------------
# HOST ONLY (the Mac's Terminal). Same command as in apps/cours-kevledev's own
# .wtfcmd.yaml, so it answers from the workspace root too.

- group: cours
  name: navigateur
  cwd: ./apps/cours-kevledev
  desc: |
    Launch the Canva bridge's Chromium (own profile, DevTools on port 9222,
    every site blocked but tools/canva/host/allowlist.pac). Run it in the
    Mac's Terminal, not VS Code's. Already running: relaunches nothing.
      wtf cours navigateur
      wtf cours navigateur --steps   → print the steps only
  flags:
    - name: steps
      desc: Print the step list only, launch nothing.
      default: ""
      test: "$bool"
  cmd: bash tools/canva/host/canva-browser.sh{{ if .steps }} --steps{{ end }}

# ---- agent-browser — the agent's own headless Chromium on the Mac ---------
# HOST ONLY (the Mac's Terminal). devcontainer-sandbox 1.13.0+ (T1) : a
# LaunchAgent keeps a headless Chromium on the Mac's GPU that the container
# drives through a proxy on host:9223 ; it never opens a window, never takes
# the focus. The image must ship it : wtf base dev, then Rebuild Container.

- group: agent-browser
  name: install
  desc: |
    Extract the kit from the devcontainer image and install one LaunchAgent per
    browser : without a list, every instance whose proxy port is in
    .devcontainer/firewall/ports.txt (host:9223 → a, host:9224 → b, the second
    browser). Prints, per instance, its origins and ports. Needs node 22+ and
    Chromium on the Mac.
  args:
    - name: instances
      desc: Browsers by letter (a, b…) ; none = every instance the firewall opens
      is_array: true
      test: ^[a-z]$
  cmd: bash ./.devcontainer/host-helpers/agent-browser-kit.sh install {{ range .instances }}{{ esc . }} {{ end }}

- group: agent-browser
  name: status
  desc: |
    launchd state, heartbeat and kit hash of the installed agent browsers.
  args:
    - name: instances
      desc: Browsers by letter (a, b…) ; none = every installed one
      is_array: true
      test: ^[a-z]$
  cmd: bash ./.devcontainer/host-helpers/agent-browser-kit.sh status {{ range .instances }}{{ esc . }} {{ end }}

- group: agent-browser
  name: uninstall
  desc: |
    Remove the LaunchAgents and their folders under ~/Library/Application Support.
  args:
    - name: instances
      desc: Browsers by letter (a, b…) ; none = every installed one
      is_array: true
      test: ^[a-z]$
  cmd: bash ./.devcontainer/host-helpers/agent-browser-kit.sh uninstall {{ range .instances }}{{ esc . }} {{ end }}

- group: agent-browser
  name: logs
  desc: |
    Follow the agent browser's logs on the Mac (supervisor, proxy, Chromium).
  args:
    - name: instance
      desc: Which browser (a, b…)
      default: a
      test: ^[a-z]$
  cmd: bash ./.devcontainer/host-helpers/agent-browser-kit.sh logs {{ esc .instance }}

# ---- ctr — CTR Native Web (apps/ctr-native-web) ------------------------------
# CONTAINER ONLY : the build needs the devcontainer's emsdk. Forward the printed
# ports to the Mac (VS Code Ports panel, same numbers) to play in your browser.

- group: ctr
  name: online
  desc: |
    Online mode by hand : build the CTR_ONLINE web client, serve it, start a local
    ctr-relay with a fresh key, print the address to open (host, then guest link).
    Ctrl-C stops both. Defaults : release, page 8094, relay 8789.
  args:
    - name: config
      desc: debug or release
      default: release
      test: ^(debug|release)$
    - name: page
      desc: Port of the page server
      default: "8094"
      test: ^[0-9]+$
    - name: relay
      desc: Port of the local ctr-relay
      default: "8789"
      test: ^[0-9]+$
  cmd: |
    [ -d /workspace/.tmp/emsdk ] || { echo "wtf ctr online : run it inside the devcontainer (it needs its emsdk)" >&2; exit 1; }
    bash ./apps/ctr-native-web/web/online/dev.sh {{ esc .config }} {{ esc .page }} {{ esc .relay }}

- group: ctr
  name: bot
  desc: |
    A fake Online guest, « Bot », to test a race alone : the agent browser opens your room
    link, joins your room, locks a character and drives one race (racing line on a debug
    build). Serve with « wtf ctr online debug 8092 8787 » (the agent browser's ports), enter
    your room, then run this before you confirm the track.
  args:
    - name: link
      desc: The room link from the Online panel (quote it, it has a #)
      test: ^https?://
  cmd: |
    [ -d /workspace/.tmp/emsdk ] || { echo "wtf ctr bot : run it inside the devcontainer" >&2; exit 1; }
    bash ./apps/ctr-native-web/web/online/bot.sh {{ esc .link }}

- group: ctr
  name: shared
  desc: |
    Share mode by hand : build the single-player web client (solo's build), serve it,
    start a local ctr-relay with a fresh key, print the address to open (host shares,
    the guest link needs no disc).
    Ctrl-C stops both. Defaults : release, page 8096, relay 8791.
  args:
    - name: config
      desc: debug or release
      default: release
      test: ^(debug|release)$
    - name: page
      desc: Port of the page server
      default: "8096"
      test: ^[0-9]+$
    - name: relay
      desc: Port of the local ctr-relay
      default: "8791"
      test: ^[0-9]+$
  cmd: |
    [ -d /workspace/.tmp/emsdk ] || { echo "wtf ctr shared : run it inside the devcontainer (it needs its emsdk)" >&2; exit 1; }
    bash ./apps/ctr-native-web/web/share/dev.sh {{ esc .config }} {{ esc .page }} {{ esc .relay }}

- group: ctr
  name: share-bot
  desc: |
    A fake Share guest, « Bot », to test a Share race alone : the agent browser opens your
    guest link and plays P2 over it — browses the characters and locks one at random, drives
    each race along the racing line and fires its items — until you stop sharing (or Ctrl-C).
    Host with « wtf ctr shared debug 8091 8788 » (the agent browser's ports ; a release host
    gets Cross held, no steering), Share → Copy guest link, then run this.
  args:
    - name: link
      desc: The guest link from the Share panel (quote it, it has a #)
      test: ^https?://
  cmd: |
    [ -d /workspace/.tmp/emsdk ] || { echo "wtf ctr share-bot : run it inside the devcontainer" >&2; exit 1; }
    bash ./apps/ctr-native-web/web/share/bot.sh {{ esc .link }}

- group: ctr
  name: solo
  desc: |
    The normal game (single player, no OnlineCTR) by hand : build the CTR_ONLINE=OFF web
    client into its own build directory, serve it, print the address. Defaults : release,
    port 8095.
  args:
    - name: config
      desc: debug or release
      default: release
      test: ^(debug|release)$
    - name: page
      desc: Port of the page server
      default: "8095"
      test: ^[0-9]+$
  cmd: |
    [ -d /workspace/.tmp/emsdk ] || { echo "wtf ctr solo : run it inside the devcontainer (it needs its emsdk)" >&2; exit 1; }
    bash ./apps/ctr-native-web/web/solo-dev.sh {{ esc .config }} {{ esc .page }}
