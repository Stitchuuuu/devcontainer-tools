# Root wtf config — global aliases for common project workflows.
# Each command runs from the repo root ; per-project cwd is set via `cd`
# in the cmd body so callers can invoke `wtf <cmd>` from anywhere.

# ---- notif — cross-compile + logs -----------------------------------------
# The container can't RUN Mach-O binaries, only produce them. Once built,
# the binary lands at apps/notifier/target/aarch64-apple-darwin/release/notif
# and is visible from the Mac host via the workspace bind-mount.
#
# `cwd: ./apps/notifier` — leading `.` resolves relative to this config
# file's directory (per wtfcmd), so commands run inside the crate root
# regardless of where the caller invoked `wtf` from.

- group: notif
  name: build
  cwd: ./apps/notifier
  desc: Cross-compile the release Mach-O for Apple Silicon.
  cmd: cargo zigbuild --release --target aarch64-apple-darwin --bin notif

- group: notif
  name: build-debug
  cwd: ./apps/notifier
  desc: Cross-compile the debug Mach-O (faster rebuild, unoptimized).
  cmd: cargo zigbuild --target aarch64-apple-darwin --bin notif

- group: notif
  name: test
  cwd: ./apps/notifier
  desc: Run every test + clippy on the workspace.
  cmd: |
    cargo clippy --workspace --all-targets -- -D warnings
    cargo test -p notif-cli -p notif-core -p notif-macos

- group: notif
  name: bin-path
  cwd: ./apps/notifier
  desc: Print the absolute container path of the release Mach-O.
  cmd: echo "$(pwd)/target/aarch64-apple-darwin/release/notif"

- group: notif
  name: log
  desc: Tail the shared audit log (NOTIF_LOG env or ~/.local/share/notif/notif.log).
  cmd: tail -f "${NOTIF_LOG:-$HOME/.local/share/notif/notif.log}"

- group: notif
  name: dev
  cwd: ./apps/notifier
  desc: |
    Build (debug) + run the Mach-O with arbitrary passthrough args.
    Example : wtf notif dev -- send --title Hello --body World
  cmd: |
    cargo zigbuild --target aarch64-apple-darwin --bin notif >/dev/null
    ./target/aarch64-apple-darwin/debug/notif {{ range .args }}{{ esc . }} {{ end }}
  args:
    - name: args
      desc: Arguments forwarded verbatim to the notif binary.
      is_array: true

# ---- image — base image suites ---------------------------------------------
# A full pass is TWO runs: one in the devcontainer (manifest, firewall, overlay
# layer 1), one on the host with Docker running (overlay layer 2, image
# suites). The runner detects which side it is on and names what is left.

- group: image
  name: test
  desc: |
    Every base-image suite, according to the detected context.
    Replay on both sides (container then host) at each minor/major bump.
  cmd: bash ./packages/devcontainer-sandbox/test/run-all.sh

- group: image
  name: release-check
  desc: |
    Full release gate before a minor/major version bump : --no-cache build,
    content + suite checks, scratch scaffold, VS Code Reopen (fresh boot +
    reattach-to-running for defect 6's one reachable path), collection,
    verdict.
    Same command on both sides, the script detects which one (/.dockerenv):
    on the host (macOS, Docker Desktop, VS Code) it plays all 11 steps and
    is the only side that can exit 0 ; inside the devcontainer it plays
    headless, against the nested dind daemon ONLY (hardcoded assertion,
    fatal otherwise), everything that does not need VS Code — and marks ∅
    steps 5/6/9 that only the human can play. Its success path is
    therefore GREEN PARTIEL / exit 2, never 0. It leaves an image tarball
    the host inherits steps 1 and 2-3 from instead of repaying them.
    Three verdicts : GREEN (everything played and verified, exit 0 — the
    image is publishable) / GREEN PARTIEL (nothing failed but at least one
    step deliberately not played or reserved for the other half, exit 2) /
    RED (a failure, or a step skipped because something upstream broke,
    exit 1).
  flags:
    - name: no-purge
      desc: |
        Do not purge the VS Code server cache (`vscode` volume, shared by
        ALL devcontainers on the machine). Step 6 is then not a cold boot
        and R2 traverses nothing : steps 5 and 9 marked ⊘, verdict GREEN
        PARTIEL, exit 2.
      default: ""
      test: "$bool"
  cmd: bash ./packages/devcontainer-sandbox/test/release-check.sh{{ if .no_purge }} --no-purge{{ end }}

# ---- ext-patch — the VS Code extension patchers of THIS container ---------
# Convenience only. The command itself is `ext-patches-update`, baked into the
# image and on PATH in any container built from it; this group just spares the
# name. Which patchers a container runs is set by EXT_PATCHES_* in
# .devcontainer/.env — the image ships none and names no repository.

- group: ext-patch
  name: status
  desc: |
    What is configured, what is cached, and whether the patch sentinels are
    live in the extension on disk. Reads only — never writes, never fetches.
  cmd: ext-patches-sync --status

- group: ext-patch
  name: update
  desc: |
    Move this container to another patch set. With no flag: resolves the
    latest release of EXT_PATCHES_REPO (falling back to its tag list, which
    is what a repository with tags and no releases uses), applies it, and
    rewrites EXT_PATCHES_REF in .devcontainer/.env — the pin only moves once
    the patchers are actually on disk. A VS Code window reload is needed for
    the change to reach the extension host.
  flags:
    - name: check
      desc: Say what is installed and what is available, then stop.
      default: ""
      test: "$bool"
    - name: ref
      desc: Install this tag or commit SHA instead of resolving the latest.
      default: ""
    - name: dir
      desc: Apply from a local checkout of patchers — no network, no token.
      default: ""
    - name: reapply
      desc: Replay the current ref from the cache, e.g. after a Claude Code bump.
      default: ""
      test: "$bool"
    - name: no-write-env
      desc: Apply without moving the pin — a trial run.
      default: ""
      test: "$bool"
  cmd: >-
    ext-patches-update{{ if .check }} --check{{ end }}{{ if .ref }} --ref
    {{ .ref }}{{ end }}{{ if .dir }} --dir {{ .dir }}{{ end }}{{ if .reapply }}
    --reapply{{ end }}{{ if .no_write_env }} --no-write-env{{ end }}

# ---- shareglaude — receive a shared Claude Code token (user B side) --------
# Runs INSIDE the devcontainer: it writes ~/.claude/.credentials.json and needs
# platform.claude.com + api.anthropic.com, both allowlisted here. Deploying the
# Worker is the opposite, host-only — see apps/shareglaude/README.md.
#
# `cwd: ./.devcontainer` so shareglaude.env and scripts/ resolve wherever the
# caller invoked wtf from. Kept here rather than in .devcontainer/.wtfcmd.yaml
# precisely so that `wtf token share` works from the workspace root.

- group: token
  name: share
  cwd: ./.devcontainer
  desc: |
    Receive a Claude Code token shared by another account, via shareglaude.
      wtf token share       → dev deployment  (SHAREGLAUDE_URL_DEV)
      wtf token share prod  → prod deployment (SHAREGLAUDE_URL_PROD)
    Prints a login URL to hand to the account holder, checks the token that
    comes back, and stages it — the live credentials are never touched here.
    Answer y at the prompt to install now, or run `wtf token promote` later.
    Reads .devcontainer/shareglaude.env.
  args:
    - name: env
      desc: Target deployment — omit for dev (workers.dev), "prod" for the custom domain.
      default: dev
      test: ^(dev|prod)$
  cmd: |
    if [ ! -f shareglaude.env ]; then
      echo "wtf token share: .devcontainer/shareglaude.env is missing." >&2
      echo "  cp .devcontainer/shareglaude.env.example .devcontainer/shareglaude.env" >&2
      exit 1
    fi
    sg_get() {
      sed -n "s/^[[:space:]]*$1=//p" shareglaude.env | tail -1 | sed -e 's/^"//' -e 's/"$//'
    }
    {{ if eq .env "prod" }}var=SHAREGLAUDE_URL_PROD{{ else }}var=SHAREGLAUDE_URL_DEV{{ end }}
    url=$(sg_get "$var")
    if [ -z "$url" ]; then
      echo "wtf token share {{ .env }}: $var is empty in .devcontainer/shareglaude.env." >&2
      exit 1
    fi
    echo "-> shareglaude {{ .env }}: $url"
    SHAREGLAUDE_KEY=$(sg_get SHAREGLAUDE_KEY) \
    SHAREGLAUDE_PROMOTE_HINT="wtf token promote" \
    exec ./scripts/claude-token-share.mjs --url "$url" --test

- group: token
  name: promote
  cwd: ./.devcontainer
  desc: |
    Install the token staged by `wtf token share`, then delete the staged file.
    No session, no login URL. Re-validates the staged token first and refuses
    one that expired or was revoked since staging.
    The current credentials are kept as .credentials.json.bak-<timestamp>.
  cmd: exec ./scripts/claude-token-share.mjs --promote

# ---- docker — disk usage and reclaim ---------------------------------------
# HOST ONLY. Inside the devcontainer, `docker` talks to the NESTED daemon
# (dind-storage-*), which has homonymous images with different IDs — you would
# measure and clean the wrong machine. Both commands refuse nothing, so check
# where you are before reading the numbers.

- group: docker
  name: usage
  desc: |
    What Docker occupies, and what of it is reclaimable. Removes nothing.
    Beyond `docker system df`, which under-reports: the build cache broken
    down BY BUILD STEP, with the image(s) each step belongs to — recovered by
    joining the step text against every image's `docker history`, since
    BuildKit does not record it. A step shown with "+N more" is shared, and
    deleting it would take a neighbour's cache with it.
  flags:
    - name: cache
      desc: Add the per-step cache table. Slower, it reads every image history.
      default: ""
      test: "$bool"
  cmd: bash ./.devcontainer/host-helpers/docker-reclaim.sh{{ if .cache }} --cache{{ end }}

- group: docker
  name: reclaim
  desc: |
    Remove Docker junk. With no flag it reports and removes NOTHING, so run it
    bare first and read what it would take.
    Named volumes are never candidates, whatever you ask — the difference
    between a cache and a database is a name you have to read. That covers
    claude-code-config-* (Claude sessions and transcripts), claude-creds-*,
    vscode, dind-storage-* and every project database. Stopped containers are
    not candidates either: a stopped project is still a project.
    Prefer --cache-dead over --cache-dupes. The cache is a DAG (98% of records
    have a parent) and the newest copy of a step descends from the older ones,
    so cache-dupes targets the parents of what it keeps and BuildKit refuses:
    measured 328 records asked, 51 freed, 2.34 GB. cache-dead takes whole
    unreferenced chains and actually reclaims the space.
  flags:
    - name: builders
      desc: |
        Inactive container-driver buildx builders AND their state volumes,
        including volumes orphaned by an earlier `buildx rm` (which leaves
        them behind — 13.44 GB was found stranded that way).
      default: ""
      test: "$bool"
    - name: dangling
      desc: Untagged images no container uses. Tagged images are never touched.
      default: ""
      test: "$bool"
    - name: anon-volumes
      desc: Anonymous volumes (64 hex chars) with zero links. Named ones, never.
      default: ""
      test: "$bool"
    - name: cache-dead
      desc: |
        Every cache chain backing no existing image — the "reclaimable" figure
        docker system df prints. No size limit. The next build re-runs those
        steps.
      default: ""
      test: "$bool"
    - name: cache-dupes
      desc: |
        Older copies of an identical step, keeping the most recent. Safe but
        largely ineffective against the DAG — see the description above.
      default: ""
      test: "$bool"
  cmd: |
    bash ./.devcontainer/host-helpers/docker-reclaim.sh{{ if or .builders .dangling .anon_volumes .cache_dead .cache_dupes }} --apply{{ end }}{{ if .builders }} builders{{ end }}{{ if .dangling }} dangling{{ end }}{{ if .anon_volumes }} anon-volumes{{ end }}{{ if .cache_dead }} cache-dead{{ end }}{{ if .cache_dupes }} cache-dupes{{ end }}
