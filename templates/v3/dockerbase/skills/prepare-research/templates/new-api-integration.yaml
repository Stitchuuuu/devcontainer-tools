template: new-api-integration
description: Integrate a third-party API (Stripe, Linear, ...) — POST allowed on the target API

prompts_for_user:
  - var: service_name
    label: "Service name (ex: Stripe)"
  - var: api_domain
    label: "API domain (ex: api.stripe.com)"
  - var: docs_domain
    label: "Docs domain (ex: docs.stripe.com)"
  - var: methods
    label: "Methods needed on the API (ex: GET,POST,DELETE)"
    default: "GET,POST"
  - var: scope_dir
    label: "Scope dir in project (ex: src/payment/)"
  - var: secret_names
    label: "Secret env var names, CSV (ex: STRIPE_API_KEY_TEST,STRIPE_WEBHOOK_SECRET)"

domains_local_additions:
  - "[{{methods}}] {{api_domain}}"
  - "{{docs_domain}}"

policy_local_d_files:
  - host: "{{api_domain}}"
    body: |
      # Generated by /prepare-research for task: {{task_slug}}
      endpoints:
        - methods: [{{methods}}]
          max_body_kb: 100

files_to_copy:
  - "{{scope_dir}}**"
  - "package.json"

instructions_md: |
  # Task: {{task_slug}}

  ## Goals
  - Read {{service_name}} documentation for the relevant resources.
  - Propose a minimal integration in {{scope_dir}}.
  - Test with sandbox/test API keys provided via env vars.

  ## Constraints
  - Do not modify files outside {{scope_dir}}.
  - Output the proposed integration (diff / new files) in /workspace/result/.
  - Use ONLY sandbox / test API keys — NEVER production credentials.
  - This research container has an isolated claude-config volume : project
    skills (/prepare-pr, /scan-deps, etc.) are NOT installed here.

  ## Success criteria
  - A working sandbox call to {{api_domain}} demonstrating the integration.
  - A short README in /workspace/result/ summarising the design and required
    env vars for the main project.

  ## Back-copy
  At the end of the session, propose this two-step procedure for the user,
  to run on the host from the main project root:

      # 1. Archive result into the bundle source (snapshot, gitignored) :
      cp -r ../{{bundle_id}}/result/. ./.devcontainer/research-bundles/{{bundle_id}}/result/

      # 2. Promote specific deliverables to {{scope_dir}}, e.g. :
      #    cp ../{{bundle_id}}/result/<file> ./{{scope_dir}}<file>

secrets_template:
  - "# Fill with sandbox/test keys (DO NOT commit). Test/sandbox only — NEVER production."
  - "{{#each secret_names}}{{this}}=REPLACE_ME{{/each}}"

initial_prompt: |
  You are starting a research session in bundle {{bundle_id}}.

  1. Read /workspace/INSTRUCTIONS.md (goals, constraints, success criteria, back-copy).
  2. If /workspace/result/PROGRESS.md exists, read it and resume from there. Otherwise, create it.
  3. Read the {{service_name}} docs ({{api_domain}}, methods: {{methods}}); try a sandbox call with the secrets from .devcontainer/.env.local.
  4. Propose the minimal integration code in /workspace/result/ — strict scope = {{scope_dir}}.
  5. Synthesis + design notes in /workspace/result/OUTPUT.md.
  6. Update /workspace/result/PROGRESS.md at every step.
  7. If success criteria are met, propose the back-copy command from INSTRUCTIONS.md.

  Reminders: sandbox only, never production keys. Scope strictly limited to {{scope_dir}}.
