# Devcontainer-scoped wtf commands.
# Discovered by wtf when the caller's cwd is inside .devcontainer/ or a
# subdir ; walks up 10 parents but does NOT descend, so callers in
# /workspace/ (root) only see the top-level .wtfcmd.yaml.

# ---- firewall — hot-reload the local layer without rebuild --------------
# Basic mode only. Wall-guard refuses strict (mitmproxy L7 reload TBD).
# Root-only by design : sudo passwordless is intentionally NOT baked (that
# would let any node-uid process mutate the allowlist). Elevation happens
# via `docker exec -u 0` which requires host-side docker socket access.
#
# Runs from the HOST : auto-detects the "app" service container of the
# compose project rooted at .devcontainer/docker-compose.yml. Inside the
# container (as node) the docker CLI + socket are usually not available,
# so the fallback errors out with a clear instruction.

- group: firewall
  name: reload
  desc: |
    Hot-reload the local firewall layer (basic mode only, sub-500ms).
    Auto-detects the compose "app" container, elevates via
    docker exec -u 0. Run from a shell with docker access (host).
  cwd: ./
  cmd: |
    if ! command -v docker >/dev/null 2>&1; then
      echo "wtf firewall reload: docker CLI not available in this shell." >&2
      echo "  Root elevation requires docker exec -u 0 from the host." >&2
      exit 1
    fi
    container=$(docker compose ps -q app 2>/dev/null | head -1)
    if [ -z "$container" ]; then
      echo "wtf firewall reload: no running 'app' service found." >&2
      echo "  Expected via: docker compose -f .devcontainer/docker-compose.yml ps app" >&2
      exit 1
    fi
    echo "-> docker exec -u 0 into $container"
    docker exec -u 0 "$container" /workspace/.devcontainer/reload-local.sh

# ---- shareglaude — receive a shared Claude Code token (user B side) --------
# Runs INSIDE the devcontainer, unlike `firewall reload` above: it writes
# ~/.claude/.credentials.json and talks to platform.claude.com +
# api.anthropic.com, both allowlisted here. Deploying the Worker is the
# opposite — that one is host-only (see apps/shareglaude/README.md).

- group: token
  name: share
  desc: |
    Receive a Claude Code token shared by another account, via shareglaude.
      wtf token share       → dev deployment  (SHAREGLAUDE_URL_DEV)
      wtf token share prod  → prod deployment (SHAREGLAUDE_URL_PROD)
    Prints a login URL to hand to the account holder, then stages the token
    with --test: the live credentials are replaced only after validation
    passed and you answered y. Reads .devcontainer/shareglaude.env.
  cwd: ./
  args:
    - name: env
      desc: Target deployment — omit for dev (workers.dev), "prod" for the custom domain.
      default: dev
      test: ^(dev|prod)$
  cmd: |
    if [ ! -f shareglaude.env ]; then
      echo "wtf token share: .devcontainer/shareglaude.env is missing." >&2
      echo "  cp .devcontainer/shareglaude.env.example .devcontainer/shareglaude.env" >&2
      exit 1
    fi
    sg_get() {
      sed -n "s/^[[:space:]]*$1=//p" shareglaude.env | tail -1 | sed -e 's/^"//' -e 's/"$//'
    }
    {{ if eq .env "prod" }}var=SHAREGLAUDE_URL_PROD{{ else }}var=SHAREGLAUDE_URL_DEV{{ end }}
    url=$(sg_get "$var")
    if [ -z "$url" ]; then
      echo "wtf token share {{ .env }}: $var is empty in .devcontainer/shareglaude.env." >&2
      exit 1
    fi
    echo "-> shareglaude {{ .env }}: $url"
    SHAREGLAUDE_KEY=$(sg_get SHAREGLAUDE_KEY) exec ./scripts/claude-token-share.mjs --url "$url" --test
