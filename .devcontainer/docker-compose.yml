name: ${DC_PROJECT:-devcontainer-tools}-claude-code

services:
  app:
    build:
      context: .
      # Slim project layer — FROM the published GHCR base image; compose
      # pulls it, nothing is built locally. BASE_IMAGE in .env is both the
      # version pin and the rollback knob (see Dockerfile header).
      dockerfile: Dockerfile
      args:
        # The three published lines: 1.10.0-cc2.1.280 (default), 1.10.0-cc2.1.272,
        # 1.10.0-cc2.1.220.
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/meitogi/devcontainer-sandbox:1.10.0-cc2.1.280}
        # Whether the build bakes firewall/domains.local.txt and
        # firewall/policy.local.d/ into the image. Hardened default is 0 :
        # those files are gitignored and container-writable, so a rebuild
        # would otherwise be a silent path from "a postinstall edited a file"
        # to "the firewall allows more". Personal opt-in through .env only.
        FIREWALL_ALLOW_LOCAL_AT_REBUILD: ${FIREWALL_ALLOW_LOCAL_AT_REBUILD:-0}
    # Local Ollama backend (cf. /opt/devcontainer/base/knowledge/ollama-local.md). Two aliases for
    # the same host gateway IP — the routing difference comes from NO_PROXY :
    #   ollama.internal  ∉ NO_PROXY  → routed via HTTP_PROXY (mitmproxy audit)
    #   ollama.local     ∈ NO_PROXY  → direct connect (debug only, no audit)
    # Switching audit ↔ bypass is a single line edit in .env, no rebuild needed.
    #
    # extra_hosts removed in favour of a CNAME chain inside dnsmasq (see
    # init-firewall.sh — dynamic resolution of host.docker.internal at boot
    # then `cname=ollama.{internal,local},host.docker.internal`). That keeps
    # the DNS allowlist in charge of ipset population — extra_hosts injected
    # entries into /etc/hosts which nsswitch consults before dnsmasq, bypassing
    # the firewall pipeline and producing a confusing ❌ in test-firewall.sh.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      # IPv6 hole closure (defense in depth):
      # 1) sysctl disable — kills v6 stack on the listed interfaces (no
      #    auto-config, no link-local). `eth0` can't be set here (Docker
      #    rejects per-interface sysctls for netdriver-created ifaces) —
      #    the network-driver_opts below handles it.
      # 2) ip6tables DROP rules in init-firewall.sh as belt+suspenders.
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    environment:
      # Nested daemon (dind sidecar below, starts with the stack). Set
      # unconditionally anyway: with dind down, `docker info` fails and
      # run-all.sh degrades to its skip behaviour — same as before docker
      # existed in this container.
      DOCKER_HOST: tcp://dind:2375
    env_file:
      - path: .env
        required: false
    networks:
      - default
    volumes:
      - ..:/workspace:delegated
      - ./vscode-settings.jsonc:/workspace/.vscode/settings.json:bind
      - bash-history:/commandhistory
      - claude-config:/home/node/.claude
      - claude-creds:/home/node/.claude-creds
      # Phase 3 A3: mitmproxy binary baked in image (/opt/mitmproxy/), volume holds CA only.
      # Mounted in both modes — empty in basic, contains mitmproxy-ca-cert.pem in strict.
      - mitmproxy:/var/lib/mitmproxy

  # Nested Docker daemon for the agent-side release-check suites. The agent
  # talks to tcp://dind:2375, never the host daemon: the nested daemon's
  # container list does not include the agent's own container, so the
  # isolation is structural (plans/release-check-dind/ROLLOUT.md).
  # Egress note: this sidecar has its own network stack — app's NET_ADMIN
  # ruleset does not apply. Accepted + documented in ROLLOUT.md § Decisions.
  # It used to be `profiles: [dind]` so the exposure window was bounded to
  # active test runs; it now starts with the stack, because a test bench that
  # has to be armed by hand is one that is silently absent when it matters —
  # `docker info` fails, HAS_DOCKER=0, and every docker-dependent suite
  # reports SKIP instead of red. The egress tradeoff is accepted knowingly.
  #
  # Footgun, now easier to trip: `docker compose up` typed INSIDE the
  # devcontainer retargets at this daemon (DOCKER_HOST is baked) and builds a
  # dind-in-dind. Compose commands for this stack are HOST commands only.
  dind:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    # The suites race the daemon otherwise: compose reports the container up
    # while dockerd is still opening its socket.
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      # Plain TCP on the compose-internal network only — no published port.
      DOCKER_TLS_CERTDIR: ""
    volumes:
      # SAME source, SAME target as app — load-bearing, not cosmetic.
      # Invariant: any path under /workspace resolves to the same bytes in
      # both daemons. The suites hand -v sources under /workspace to this
      # daemon; an absent source is silently created EMPTY by docker, which
      # turns "nothing leaked" assertions into vacuous passes (false green).
      - ..:/workspace:delegated
      - dind-storage:/var/lib/docker
    networks:
      - default

networks:
  default:
    driver_opts:
      # Per-interface IPv6 disable for eth0 (created by the netdriver).
      # `IFNAME` is replaced by Docker with the actual interface name.
      com.docker.network.endpoint.sysctls: net.ipv6.conf.IFNAME.disable_ipv6=1

volumes:
  bash-history:
    name: claude-code-bashhistory-${DC_PROJECT:-devcontainer-tools}
  claude-config:
    name: claude-code-config-${DC_PROJECT:-devcontainer-tools}
  claude-creds:
    name: ${CLAUDE_CREDS_VOLUME:-claude-creds-${DC_PROJECT:-devcontainer-tools}}
    external: true
  mitmproxy:
    name: mitmproxy-${DC_PROJECT:-devcontainer-tools}
  dind-storage:
    name: dind-storage-${DC_PROJECT:-devcontainer-tools}
