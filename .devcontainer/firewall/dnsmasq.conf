# dnsmasq — base config (Phase 1).
# Per-host server= and ipset= rules are GENERATED at boot from
# /etc/devcontainer-firewall/domains.txt + domains.local.txt by init-firewall.sh,
# and loaded via an additional `--conf-file` passed on the command line.

# Listen only on loopback — this resolver is not exposed to other containers
listen-address=127.0.0.53
bind-interfaces

# Don't read system resolv.conf or /etc/hosts (we control everything explicitly)
no-resolv
no-hosts

# Default upstream for non-listed domains: Docker's internal resolver
# (lets container names like theshop-db / redis / host.docker.internal resolve).
server=127.0.0.11

# Cache size — slight perf boost for repeated resolutions
cache-size=1000
